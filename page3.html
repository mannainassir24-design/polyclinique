<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Votre Nom et Prénom">
    <meta name="description" content="Contactez la Polyclinique El Nassir pour toute question ou prise de rendez-vous.">
    <title>Contact - Polyclinique El Nassir</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header>
        <h1>Contactez-nous</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="page1.html">Présentation</a></li>
            <li><a href="page2.html">Spécialités</a></li>

            <li><a href="page4.html">Audio</a></li>
            <li><a href="page5.html">Vidéo</a></li>
        </ul>
    </nav>
    <section>
        <h2>Prise de Rendez-vous ou Demande d'Information</h2>
        <form action="#" method="POST">
            <label for="nom">Nom complet :</label>
            <input type="text" id="nom" name="nom" required placeholder="Votre nom...">
            
            <label for="email">Adresse Email :</label>
            <input type="email" id="email" name="email" required placeholder="votre.email@exemple.com">
            
            <label for="telephone">Téléphone :</label>
            <input type="tel" id="telephone" name="telephone" placeholder="Votre numéro...">

            <label for="message">Votre Message / Demande de rendez-vous :</label>
            <textarea id="message" name="message" rows="4" required placeholder="Précisez votre demande..."></textarea>
            
            <button type="submit">Envoyer la demande</button>
        </form>
    </section>
    <footer>
        <p>&copy; 2026 - Polyclinique El Nassir</p>
    </footer>
</body>
</html>
